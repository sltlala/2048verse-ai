# 2048 机器人状态页 (静态)
# 机器人停止时用: 域名/裸IP 打开显示"已停止"页, 不再反代到 127.0.0.1:8765
# 重新启动机器人后想恢复实时面板: 把 location / 换回 proxy_pass http://bot2048_panel;
server {
    listen 80;
    server_name 2048.sltlala.top;
    include /etc/nginx/snippets/acme.conf;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name 2048.sltlala.top;

    ssl_certificate     /etc/letsencrypt/live/2048.sltlala.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/2048.sltlala.top/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/bot2048.access.log;
    error_log  /var/log/nginx/bot2048.error.log;

    root /var/www/bot2048;
    index index.html;
    location / { try_files $uri $uri/ =404; }
}
